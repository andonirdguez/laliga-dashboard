name: Actualización diaria La Liga

on:
  schedule:
    - cron: "0 5 * * *"        # 05:00 UTC = 07:00 en Madrid (verano)
  workflow_dispatch:           # botón "Run workflow" para lanzarlo a mano
    inputs:
      sources:
        description: "Fuentes (vacío = todas): footballdata clubelo understat transfermarkt fbref"
        required: false
        default: ""

permissions:
  contents: write              # necesario para el commit automático

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Caché de soccerdata (evita re-scrapear lo que no cambia) y del bronze (histórico Elo)
      - name: Restaurar caché de datos
        uses: actions/cache@v4
        with:
          path: |
            ~/soccerdata
            data/bronze
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      - name: Ingesta (bronze)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.sources }}" ]; then
            python pipeline/ingest.py --source ${{ github.event.inputs.sources }}
          else
            python pipeline/ingest.py
          fi

      - name: Transformación (silver + gold)
        run: python pipeline/transform.py

      - name: Subir log como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: logs/
          retention-days: 14

      - name: Commit de data/gold si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold
          if git diff --cached --quiet; then
            echo "Sin cambios en gold"
          else
            git commit -m "datos: actualización $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
